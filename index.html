  <style>
    :root {
      /* ===== TEMA CLEAN (claro) — dourado + verde escuro (Programa Cuidado Seguro) ===== */
      --bg-page: #fafaf8;
      --bg-header: #1c3a2c;
      --bg-card: #ffffff;
      --bg-soft: #f2f0ea;          /* bolha do bot */
      --bg-input: #ffffff;
      --text: #201d17;
      --text-dim: #4d493f;
      --text-muted: #9a9384;
      --border: rgba(32, 29, 23, 0.08);
      --border-accent: rgba(184, 135, 74, 0.35);
      --accent: #b8874a;
      --accent-bright: #cfa05f;
      --accent-dark: #8f6530;
      --accent-soft: rgba(184, 135, 74, 0.10);
      --accent-glow: rgba(184, 135, 74, 0.32);
      --green: #25d366;
      --green-dark: #1faa52;
      --gold: #b8874a;
      --red: #c0433f;
      --gradient: linear-gradient(135deg, #b8874a 0%, #8f6530 100%);
      --gradient-gold: linear-gradient(135deg, #d4a566 0%, #b8874a 100%);
      --shadow-soft: 0 1px 2px rgba(32,29,23,.05), 0 8px 24px rgba(32,29,23,.06);
      --radius: 18px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-page);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
      animation: headerIn .6s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes headerIn { from { transform: translateY(-100%); } to { transform: translateY(0); } }
    .topbar {
      max-width: 720px; margin: 0 auto; padding: 10px 18px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-badge {
      display: flex; align-items: center; flex-shrink: 0;
    }
    .brand-badge img { height: 42px; width: auto; max-width: 160px; object-fit: contain; display: block; }
    .brand-sub {
      font-size: 12.5px; font-weight: 600; color: var(--text-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .step-pill {
      background: var(--accent-soft); color: var(--accent-dark);
      font-size: 12px; font-weight: 700; padding: 6px 13px; border-radius: 99px;
      flex-shrink: 0; letter-spacing: .02em;
    }
    .step-pill.bump { animation: pillBump .4s ease; }
    @keyframes pillBump { 50% { transform: scale(1.18); } }
    .progress-line { height: 3px; background: var(--accent-soft); }
    .progress-line i {
      display: block; height: 100%; width: 0%;
      background: var(--gradient); border-radius: 0 3px 3px 0;
      transition: width .6s cubic-bezier(.22,1,.36,1);
    }

    /* ===== CHAT ===== */
    main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
    .chat { max-width: 720px; margin: 0 auto; padding: 28px 18px 24px; display: flex; flex-direction: column; gap: 14px; }

    .row { display: flex; gap: 10px; align-items: flex-end; animation: msgIn .45s cubic-bezier(.22,1,.36,1) both; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
    .row.user { justify-content: flex-end; }

    .avatar {
      width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
      background: var(--bg-header); border: 1.5px solid var(--border-accent);
      overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar img.is-logo { object-fit: contain; padding: 4px; background: #fff; }
    .row.cont .avatar { visibility: hidden; }

    .bubble {
      max-width: 82%;
      padding: 13px 17px;
      border-radius: var(--radius);
      font-size: 15px;
      line-height: 1.55;
      color: var(--text-dim);
      word-break: break-word;
    }
    .bubble b, .bubble strong { color: var(--text); font-weight: 700; }
    .row.bot .bubble { background: var(--bg-soft); border-bottom-left-radius: 6px; }
    .row.user .bubble {
      background: var(--gradient); color: #fff; font-weight: 600;
      border-bottom-right-radius: 6px; box-shadow: 0 4px 18px rgba(184,135,74,.28);
    }
    .row.user .bubble b { color: #fff; }

    /* typing indicator */
    .typing { display: inline-flex; gap: 5px; padding: 17px; align-items: center; }
    .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: .3; animation: dotPulse 1.1s infinite; }
    .typing i:nth-child(2) { animation-delay: .18s; }
    .typing i:nth-child(3) { animation-delay: .36s; }
    @keyframes dotPulse { 30% { opacity: 1; transform: translateY(-4px) } }

    /* ===== LOADER DE RETENÇÃO (cargas longas) ===== */
    .loader-card { min-width: min(300px, 70vw); background: var(--bg-card) !important; border: 1px solid var(--border); box-shadow: var(--shadow-soft); }
    .loader-title { font-weight: 700; color: var(--text); font-size: 14px; }
    .loader-steps { margin-top: 12px; display: flex; flex-direction: column; gap: 9px; }
    .lstep { display: flex; gap: 10px; align-items: center; font-size: 13.5px; color: var(--text-muted); transition: color .3s; }
    .lstep .ic {
      width: 18px; height: 18px; flex-shrink: 0; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800;
    }
    .lstep.doing { color: var(--text); font-weight: 600; }
    .lstep.doing .ic::after {
      content: ''; width: 11px; height: 11px; border-radius: 50%;
      border: 2px solid var(--accent-soft); border-top-color: var(--accent);
      animation: spin .7s linear infinite;
    }
    .lstep.ok { color: var(--text-dim); }
    .lstep.ok .ic { background: #e7f2ea; color: var(--green-dark); animation: popIn .3s ease; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes popIn { from { transform: scale(.4); } 70% { transform: scale(1.2); } to { transform: scale(1); } }
    .loader-bar { margin-top: 14px; height: 5px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
    .loader-bar i {
      display: block; height: 100%; width: 5%;
      background: var(--gradient); border-radius: 3px;
      transition: width .9s cubic-bezier(.22,1,.36,1);
      position: relative;
    }
    .loader-bar i::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

    /* ===== RESULT CARD + CTA ===== */
    .result-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      border-radius: var(--radius);
      padding: 20px;
      max-width: 88%;
    }
    .result-card h3 { font-size: 16px; margin-bottom: 8px; color: var(--text); }
    .result-card p { font-size: 14.5px; line-height: 1.6; color: var(--text-dim); }
    .score-pill {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--accent-soft);
      padding: 5px 13px; border-radius: 99px; font-size: 12.5px; font-weight: 700;
      color: var(--accent-dark); margin-bottom: 12px; letter-spacing: .04em;
    }
    .cta-btn {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      width: 100%; padding: 15px; margin-top: 2px;
      border: none; border-radius: 13px; cursor: pointer;
      font-family: inherit; font-size: 15px; font-weight: 700; color: #fff;
      text-decoration: none; transition: transform .15s, box-shadow .15s;
    }
    .cta-btn:active { transform: scale(.97); }
    .cta-btn.whats { background: linear-gradient(135deg, #25d366, #1faa52); box-shadow: 0 6px 20px rgba(37,211,102,.3); }
    .cta-btn.gift { background: var(--gradient-gold); color: #3c2503; box-shadow: 0 6px 22px rgba(184,135,74,.35); animation: giftPulse 2s ease-in-out infinite; }
    @keyframes giftPulse { 50% { box-shadow: 0 6px 32px rgba(184,135,74,.55); transform: translateY(-1px); } }
    .cta-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* ===== INPUT DOCK (inline: aparece logo abaixo da pergunta) ===== */
    .dock { width: 100%; padding: 2px 0 6px; }
    .dock-inner { max-width: 100%; }
    .field-label {
      font-size: 10.5px; letter-spacing: .22em; font-weight: 700;
      color: var(--text-muted); text-transform: uppercase;
      margin: 0 0 8px 6px; display: none;
    }
    .input-wrap {
      display: none;
      align-items: center; gap: 8px;
      background: var(--bg-input);
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-soft);
      border-radius: 99px;
      padding: 7px 7px 7px 20px;
      transition: border-color .25s, box-shadow .25s;
      animation: msgIn .4s both;
    }
    .input-wrap.show { display: flex; }
    .field-label.show { display: block; }
    .input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .input-wrap .prefix { color: var(--text-muted); font-weight: 600; font-size: 15px; display: none; }
    .input-wrap .prefix.show { display: block; }
    .input-wrap .prefix .ddi-sel { border: none; background: transparent; font: inherit; font-weight: 600; color: var(--text); cursor: pointer; outline: none; padding: 0 2px 0 0; max-width: 96px; }
    .input-wrap input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-family: inherit; font-size: 16px; min-width: 0;
    }
    .input-wrap input::placeholder { color: var(--text-muted); }
    .send-btn {
      width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--gradient); color: #fff; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: .3; pointer-events: none; transition: opacity .25s, transform .15s;
    }
    .send-btn.ready { opacity: 1; pointer-events: auto; box-shadow: 0 4px 14px var(--accent-glow); }
    .send-btn:active { transform: scale(.92); }
    .input-hint { font-size: 12px; color: var(--red); margin: 7px 6px 0; min-height: 15px; }
    .lgpd { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 10px; line-height: 1.5; }

    /* select (não usado no fluxo atual, mantido por compatibilidade) */
    .select-wrap { display: none; align-items: center; gap: 8px; animation: msgIn .4s both; }
    .select-wrap.show { display: flex; }
    .select-shell { position: relative; flex: 1; min-width: 0; }
    .select-shell select {
      width: 100%; appearance: none; -webkit-appearance: none;
      background: var(--bg-card); border: 1.5px solid var(--border);
      box-shadow: var(--shadow-soft); border-radius: 99px;
      padding: 14px 44px 14px 20px; font-family: inherit; font-size: 15px;
      color: var(--text); outline: none; cursor: pointer; transition: border-color .25s, box-shadow .25s;
    }
    .select-shell select:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .select-shell select:invalid { color: var(--text-muted); }
    .select-shell::after {
      content: '▾'; position: absolute; right: 19px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none; font-size: 13px;
    }

    /* aviso importante (disclaimer) */
    .gatilho-falta {
      margin-top: 12px; display: flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, #fbf4ea, #f6e9d4);
      border: 1.5px solid #e3c68f; border-radius: 12px; padding: 11px 14px;
      font-size: 13px; color: #5c4321; font-weight: 600;
    }
    .gatilho-falta .gf-ic { font-size: 18px; }
    .gatilho-falta b { color: #3d2c14; }

    /* chips */
    .chips { display: none; flex-wrap: wrap; gap: 9px; justify-content: center; animation: msgIn .4s both; }
    .chips.show { display: flex; }
    .chip {
      background: var(--bg-card); border: 1.5px solid var(--border);
      box-shadow: var(--shadow-soft);
      color: var(--text-dim); border-radius: 99px;
      padding: 11px 18px; font-family: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all .18s;
    }
    .chip:hover, .chip:focus-visible { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-soft); }
    .chip:active { transform: scale(.95); }

    /* ===== AGENDA INLINE (no chat) ===== */
    .agenda-card {
      padding: 0 !important; overflow: hidden; width: min(380px, 88vw);
      background: var(--bg-card) !important; border: 1px solid var(--border);
      box-shadow: var(--shadow-soft); border-radius: var(--radius);
    }
    .ag-head {
      background: var(--bg-header); color: #fff;
      padding: 15px 18px; display: flex; gap: 12px; align-items: center;
    }
    .ag-head .ag-ic { font-size: 20px; }
    .ag-head h4 { font-size: 15.5px; font-weight: 700; }
    .ag-head p { font-size: 12px; color: rgba(255,255,255,.65); margin-top: 1px; }
    .ag-body { padding: 14px 14px 16px; }
    .ag-today {
      display: flex; justify-content: center; margin-bottom: 12px;
    }
    .ag-today span {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--border); border-radius: 99px;
      padding: 7px 14px; font-size: 12.5px; color: var(--text-dim); font-weight: 500;
      box-shadow: var(--shadow-soft);
    }
    .ag-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .ag-nav b { font-size: 15px; color: var(--text); }
    .ag-nav button {
      width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--bg-soft); color: var(--text); font-size: 15px;
      display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    .ag-nav button:disabled { opacity: .3; cursor: default; }
    .ag-nav button:not(:disabled):hover { background: var(--accent-soft); color: var(--accent-dark); }
    .ag-grid {
      border: 1px solid var(--border); border-radius: 14px; padding: 10px 8px;
      box-shadow: var(--shadow-soft);
    }
    .ag-week, .ag-days { display: grid; grid-template-columns: repeat(7, 1fr); }
    .ag-week span {
      text-align: center; font-size: 11px; font-weight: 700;
      color: var(--text-muted); padding: 4px 0 8px;
    }
    .ag-d {
      aspect-ratio: 1; border: none; background: none; border-radius: 50%;
      font-family: inherit; font-size: 13.5px; display: flex; align-items: center;
      justify-content: center; color: #ccc7ba; cursor: default; margin: 1px auto;
      width: 36px; max-width: 100%;
    }
    .ag-d.on { color: var(--text); font-weight: 700; cursor: pointer; transition: all .15s; }
    .ag-d.on:hover { background: var(--accent-soft); }
    .ag-d.sel { background: var(--bg-header); color: #fff; font-weight: 700; }
    .ag-slots-title { font-size: 13px; font-weight: 600; color: var(--text); margin: 14px 2px 9px; }
    .ag-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .ag-slot {
      border: 1.5px solid var(--border); border-radius: 11px; background: var(--bg-card);
      padding: 11px 4px; font-family: inherit; font-size: 14px; font-weight: 600;
      color: var(--text); cursor: pointer; transition: all .15s; box-shadow: var(--shadow-soft);
    }
    .ag-slot:hover { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-soft); }
    .ag-foot { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 13px; }
    .ag-wa { display: block; text-align: center; font-size: 12.5px; color: var(--accent-dark); font-weight: 600; margin-top: 9px; text-decoration: none; }
    .ag-done { padding: 26px 18px; text-align: center; }
    .ag-done .ag-check {
      width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 12px;
      background: #e7f2ea; color: var(--green-dark); font-size: 24px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      animation: popIn .4s ease;
    }
    .ag-done h4 { font-size: 16px; color: var(--text); margin-bottom: 5px; }
    .ag-done p { font-size: 13.5px; color: var(--text-dim); }
    .ag-link {
      display: inline-flex; align-items: center; justify-content: center;
      margin-top: 14px; padding: 12px 18px; border-radius: 11px;
      background: var(--gradient); color: #fff; font-weight: 700; font-size: 13.5px;
      text-decoration: none; box-shadow: 0 5px 18px rgba(184,135,74,.3);
    }
    /* card com o booker embutido (agendamento real via instância) */
    .cal-embed-card { width: 100%; max-width: 96% !important; }
    .cal-embed-body { background: #fff; }
    .cal-embed-slot { min-height: 560px; max-height: 660px; overflow-y: auto; }
    .cal-embed-slot iframe { border: 0; display: block; }

    /* ===== CARD DO PAINEL ESTRATÉGICO DA ROTINA (oferta R$47) ===== */
    .produto-bubble {
      padding: 0 !important; overflow: hidden; width: min(340px, 85vw);
      background: linear-gradient(165deg, #142a20 0%, #1c3a2c 55%, #0f2018 100%) !important;
      border: 1px solid rgba(184, 135, 74, .35);
      box-shadow: 0 16px 44px rgba(28, 58, 44, .32);
      border-radius: var(--radius);
      animation: produtoIn .6s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes produtoIn { from { opacity: 0; transform: translateY(20px) scale(.95); } to { opacity: 1; transform: none; } }
    .pr-body { padding: 18px 18px 17px; position: relative; }
    .pr-glow {
      position: absolute; top: -50px; right: -50px; width: 180px; height: 180px;
      border-radius: 50%; background: radial-gradient(circle, rgba(212,165,102,.35), transparent 68%);
      pointer-events: none;
    }
    .pr-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--gradient-gold); color: #3c2503;
      font-size: 10.5px; font-weight: 800; letter-spacing: .08em;
      padding: 5px 11px; border-radius: 99px;
    }
    .pr-kicker { margin-top: 14px; font-size: 11px; letter-spacing: .3em; color: #e3c06b; font-weight: 700; }
    .pr-title { font-size: 25px; line-height: 1.12; font-weight: 800; color: #fff; margin-top: 4px; }
    .pr-sub { font-size: 12.5px; color: rgba(255,255,255,.78); margin-top: 8px; line-height: 1.5; }
    .pr-sub b { color: #fff; }
    .pr-stack { margin-top: 15px; display: flex; flex-direction: column; gap: 7px; position: relative; }
    .pr-item {
      background: rgba(255,255,255,.97); border-radius: 10px; padding: 9px 12px;
      display: flex; align-items: center; gap: 9px;
      font-size: 12px; font-weight: 600; color: #24291f;
      box-shadow: 0 4px 14px rgba(0,0,0,.22); text-align: left;
    }
    .pr-item .n { background: var(--gradient); color: #fff; font-size: 10px; font-weight: 800; border-radius: 6px; padding: 3px 6px; flex-shrink: 0; }
    .pr-foot {
      margin-top: 18px; display: flex; align-items: baseline; justify-content: center; gap: 8px;
      font-size: 13px; color: rgba(255,255,255,.82);
    }
    .pr-foot b { color: #f0cd86; font-size: 18px; letter-spacing: .03em; }
    .pr-cta {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin: 4px 18px 18px; padding: 14px; border-radius: 12px; border: none; cursor: pointer;
      background: var(--gradient-gold); color: #3c2503; font-family: inherit;
      font-size: 14.5px; font-weight: 800; text-decoration: none;
      box-shadow: 0 6px 20px rgba(212,165,102,.35); transition: transform .15s;
    }
    .pr-cta:active { transform: scale(.97); }

    /* ===== BLOCO DE PILARES PRIORITÁRIOS ===== */
    .pilar-item { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; }
    .pilar-item .pi-num {
      flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
      background: var(--accent-soft); color: var(--accent-dark);

/* ================================================================

/* ================================================================

  },
];
function classificar(score) {
  return CLASSIFICACOES.find(c => score >= c.min && score <= c.max) || CLASSIFICACOES[0];
}
function calcularScore() {
  return Object.values(state.data.respostas || {}).reduce((s, r) => s + (r.pontos || 0), 0);
}
function pilaresPrioritarios() {
  const lista = Object.entries(PILARES).map(([id, p]) => {
    const total = Object.entries(state.data.respostas || {}).reduce((s, [qid, r]) => {
      const pergunta = PERGUNTAS.find(pg => pg.id === qid);
      return s + (pergunta && pergunta.pilares.includes(id) ? (r.pontos || 0) : 0);
    }, 0);
    return { id, nome: p.nome, resumo: p.resumo, total };
  });
  lista.sort((a, b) => b.total - a.total);
  return lista.slice(0, 3);
}

/* ================================================================

const DOMAIN_FIXES = {

function sugerirEmail(email) {
  const [u, domain] = email.toLowerCase().split('@');
  if (!domain) return null;
  if (DOMAIN_FIXES[domain]) return u + '@' + DOMAIN_FIXES[domain];
  return null;
}

function safeData() {
  const d = state.data;
  return { primeiro: esc((d.nome || '').split(' ')[0]) };
}

/* ================================================================
   ESTADO + PERSISTÊNCIA
   ================================================================ */
const SKEY = 'cuidado_seguro_scanner_v1';
let state = { step: 0, data: {}, leadRef: null, done: false };
try {
  const saved = JSON.parse(localStorage.getItem(SKEY) || 'null');
  if (saved && saved.leadRef) state = saved;
} catch (e) {}
if (!state.leadRef) state.leadRef = 'lr_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
if (!state.data.respostas) state.data.respostas = {};
if (!state.data.qualificacao) state.data.qualificacao = {};
function persist() { try { localStorage.setItem(SKEY, JSON.stringify(state)); } catch (e) {} }

/* captura UTMs/click-id da URL de entrada — 1x, e persiste no state (sobrevive
   às etapas/refresh e vai junto em todo salvarLead). Preserva a 1ª atribuição. */
(function capturarUTMs() {
  try {
    const p = new URLSearchParams(location.search);
    const get = (k) => (p.get(k) || '').slice(0, 200);
    const u = {
      source: get('utm_source'), medium: get('utm_medium'), campaign: get('utm_campaign'),
      content: get('utm_content'), term: get('utm_term'), fbclid: get('fbclid') || get('gclid'),
    };
    state.data.utm = state.data.utm || {};
    let mudou = false;
    for (const k of Object.keys(u)) if (u[k] && !state.data.utm[k]) { state.data.utm[k] = u[k]; mudou = true; }
    if (!state.data.referrer && document.referrer) { state.data.referrer = document.referrer.slice(0, 300); mudou = true; }
    if (mudou) persist();
  } catch (e) {}
})();

/* ================================================================

const $ = (id) => document.getElementById(id);
const chat = $('chat'), main = $('main'), input = $('input'), sendBtn = $('sendBtn');

const prefixEl = $('prefix'), hintEl = $('hint'), lgpdEl = $('lgpd');

const avatarHtml = () =>

function addRow(side, html, extraClass = '') {
  const row = document.createElement('div');
  row.className = `row ${side}${side === lastSide && side === 'bot' ? ' cont' : ''}`;
  row.innerHTML = side === 'bot'
    ? `${avatarHtml()}<div class="bubble ${extraClass}">${html}</div>`
    : `<div class="bubble">${html}</div>`;
  chat.appendChild(row);
  lastSide = side;
  scrollDown();
  return row;
}

function showTyping() {
  const t = document.createElement('div');
  t.className = `row bot${lastSide === 'bot' ? ' cont' : ''}`;
  t.innerHTML = `${avatarHtml()}<div class="bubble typing"><i></i><i></i><i></i></div>`;
  chat.appendChild(t); scrollDown();
  return t;
}
function hideTyping(t) { if (t) t.remove(); }

async function bot(html, { delay = 900 } = {}) {
  const t = showTyping();
  await sleep(delay);
  hideTyping(t);
  addRow('bot', html);
}

/* input dock modes — o dock é inline: sempre vai pro fim do chat,
   logo abaixo da última pergunta */
const dockEl = $('dock');
let onSubmit = null;
function ensureDockLast() { chat.appendChild(dockEl); }
function hideDock() {
  wrapEl.classList.remove('show'); labelEl.classList.remove('show');
  chipsEl.classList.remove('show');
  hintEl.textContent = '';
}
function askText({ label, placeholder, prefix = '', type = 'text', mask = null, validate, onOk, ddiSelect = false }) {
  hideDock(); ensureDockLast();
  labelEl.textContent = label; labelEl.classList.add('show');
  wrapEl.classList.add('show');
  if (ddiSelect) {
    // seletor de país (DDI) no lugar do prefixo fixo; Brasil é o padrão
    foneDDI = '55';
    prefixEl.innerHTML = '<select id="ddiSel" class="ddi-sel" aria-label="País"></select>';
    const sel = prefixEl.querySelector('#ddiSel');
    sel.innerHTML = PAISES.map((p) => `<option value="${p.ddi}">${p.f} +${p.ddi}</option>`).join('');
    sel.value = '55';
    prefixEl.classList.add('show');
    sel.onchange = () => {
      foneDDI = sel.value;
      input.value = mask ? mask(input.value) : input.value;
      input.placeholder = foneDDI === '55' ? '(11) 99999-9999' : 'só os números';
      hintEl.textContent = '';
      sendBtn.classList.toggle('ready', validate(input.value).ok);
      input.focus({ preventScroll: true });
    };
  } else {
    prefixEl.textContent = prefix; prefixEl.classList.toggle('show', !!prefix);
  }
  input.value = ''; input.placeholder = placeholder;
  input.type = type; input.inputMode = type === 'tel' ? 'tel' : (type === 'email' ? 'email' : 'text');
  sendBtn.classList.remove('ready');
  input.oninput = () => {
    if (mask) input.value = mask(input.value);
    hintEl.textContent = '';
    sendBtn.classList.toggle('ready', validate(input.value).ok);
  };
  onSubmit = async () => {
    const v = validate(input.value);
    if (!v.ok) { hintEl.textContent = v.erro || ''; return; }
    hideDock(); onSubmit = null;
    await onOk(v.valor);
  };
  setTimeout(() => input.focus({ preventScroll: true }), 350);
}
function askChips(options, onPick) {
  hideDock(); ensureDockLast();
  chipsEl.textContent = '';
  options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = opt;
    b.onclick = async () => { hideDock(); await onPick(opt); };
    chipsEl.appendChild(b);
  });
  chipsEl.classList.add('show');
  scrollDown();
}

  81:'PE',87:'PE',82:'AL',83:'PB',84:'RN',85:'CE',88:'CE',86:'PI',89:'PI',
  91:'PA',93:'PA',94:'PA',92:'AM',97:'AM',95:'RR',96:'AP',98:'MA',99:'MA',
};
const maskFone = (v) => {
  const d = v.replace(/\D/g, '').slice(0, 11);
  if (d.length <= 2) return d.length ? `(${d}` : '';
  if (d.length <= 7) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
};
const vFone = (v) => {
  const d = v.replace(/\D/g, '');
  if (d.length !== 11) return { ok: false, erro: d.length > 2 && !DDD_UF[+d.slice(0,2)] ? 'DDD inválido' : '' };
  if (!DDD_UF[+d.slice(0, 2)]) return { ok: false, erro: 'Esse DDD não existe no Brasil 🤔' };
  if (d[2] !== '9') return { ok: false, erro: 'Celular começa com 9 depois do DDD' };
  return { ok: true, valor: d };
};

const PAISES = [

  { f: '🇫🇷', ddi: '33', nome: 'França' }, { f: '🇩🇪', ddi: '49', nome: 'Alemanha' },
];
let foneDDI = '55';   // DDI ativo no campo de WhatsApp (atualizado pelo seletor de país)
const maskFoneIntl = (v) => (foneDDI === '55' ? maskFone(v) : v.replace(/\D/g, '').slice(0, 15));
const vFoneIntl = (v) => {
  if (foneDDI === '55') return vFone(v);                 // Brasil: regra estrita (DDD + 9)
  const d = v.replace(/\D/g, '');
  if (d.length < 6 || d.length > 14) return { ok: false, erro: d.length > 3 ? 'Número parece incompleto 🤔' : '' };
  return { ok: true, valor: d };
};
const vEmail = (v) => {
  const t = v.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(t)) return { ok: false, erro: '' };
  return { ok: true, valor: t };
};

/* Conversão Meta (Pixel + CAPI) — dispara pra lead ALTO RISCO/URGENTE
   (o que definimos como "qualificado" neste funil). Evento de Lead puro
   (SEM valor). Mesmo eventID no Pixel e na CAPI → o Meta deduplica.
   Hash dos dados e token da CAPI ficam no backend (/api/fb-event). */
function dispararEventoMeta(eventName, flagKey, contentName) {
  const d = state.data;
  if (d[flagKey]) return;                       // evita duplicar (1x por lead)
  d[flagKey] = true; persist();

  const eventId = `${eventName.toLowerCase()}_${state.leadRef || 'x'}_${Date.now()}`;
  const custom = { content_name: contentName, currency: 'BRL' };

  try { if (window.fbq) fbq('track', eventName, custom, { eventID: eventId }); } catch (e) {}

  const cookie = (n) => (document.cookie.match('(^|;)\\s*' + n + '=([^;]+)') || [])[2] || '';
  postJSON(CONFIG.API_FB_EVENT, {
    event_name: eventName, event_id: eventId, track: d.callTrack,
    content_name: contentName,
    email: d.email || '', phone: d.whatsapp || '', nome: d.nome || '',
    fbp: cookie('_fbp'), fbc: cookie('_fbc'),
    event_source_url: location.href, currency: 'BRL',
  }, 6000);
}
function dispararLeadQualificado() { if (state.data.qualificado) dispararEventoMeta('Lead', 'leadPixelEnviado', 'Scanner do Envelhecimento — lead qualificado'); }
function dispararAgendamento() { dispararEventoMeta('Schedule', 'schedulePixelEnviado', 'Consultoria — Cuidado Seguro'); }

async function postJSON(url, payload, timeoutMs = 9000) {
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), timeoutMs);
    const r = await fetch(url, {
      method: 'POST', signal: ctl.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    clearTimeout(timer);
    if (r.ok) return await r.json();
  } catch (e) { /* rede falhou */ }
  return null;
}

async function etapaPergunta(idx, replay = false) {
  const q = PERGUNTAS[idx];
  if (!replay) await bot(q.pergunta, { delay: 800 });
  askChips(q.opcoes.map(o => o.texto), async (texto) => {
    user(texto);
    const opt = q.opcoes.find(o => o.texto === texto);
    state.data.respostas[q.id] = { letra: opt.letra, pontos: opt.pontos };
    state.step = 3 + idx + 1; persist(); setProgress(state.step);
    if (idx + 1 < PERGUNTAS.length) await etapaPergunta(idx + 1);
    else await etapaIntroQualificacao();
  });
}

  await bot('Só mais algumas perguntas rápidas pra eu te ajudar melhor:', { delay: 1000 });
  await etapaQualificacao(0);
}

async function etapaQualificacao(idx, replay = false) {
  const q = QUALIFICACAO[idx];
  if (!replay) await bot(q.pergunta, { delay: 700 });
  askChips(q.opcoes, async (opt) => {
    user(opt);
    state.data.qualificacao[q.id] = opt;
    state.step = 13 + idx + 1; persist(); setProgress(state.step);
    if (idx + 1 < QUALIFICACAO.length) {
      await etapaQualificacao(idx + 1);
    } else {
      const score = calcularScore();
      const tier = classificar(score);
      const top3 = pilaresPrioritarios();
      state.data.score = score;
      state.data.classificacao = tier.nome;
      state.data.pilaresPrioritarios = top3.map(p => p.nome).join(' | ');
      const altoRiscoUrgente = score >= 13 && state.data.qualificacao.urgencia === 'Imediatamente';
      // família já investe bem no cuidado (2 faixas mais altas) → vai direto pro
      // agendamento da consultoria, sem passar pela oferta do Painel R$47
      state.data.investeAlto = INVESTIMENTOS_ALTOS.includes(state.data.qualificacao.investimento);
      state.data.qualificado = altoRiscoUrgente || state.data.investeAlto;
      persist();
      salvarLead('completo');
      dispararLeadQualificado();
      await etapaFinal();
    }
  });
}

const DIAS_SEMANA_ABREV = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
const fmtMes = new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' });
const fmtDiaLongo = new Intl.DateTimeFormat('pt-BR', { day: 'numeric', month: 'long' });
const fmtSemana = new Intl.DateTimeFormat('pt-BR', { weekday: 'long' });
const keyDia = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
const capitalizar = (t) => t.charAt(0).toUpperCase() + t.slice(1);

function slotsDoDia(dt) {
  const A = CONFIG.AGENDA;
  const agora = new Date();
  const minTs = agora.getTime() + A.minHorasAntecedencia * 3600000;
  return A.horarios.filter((h) => {
    const [hh, mm] = h.split(':').map(Number);
    const slot = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate(), hh, mm);
    return slot.getTime() >= minTs;
  });
}

function diasDisponiveis() {
  const A = CONFIG.AGENDA;
  const dias = new Map();
  const hoje = new Date();
  for (let i = 0; i <= A.diasAdiante; i++) {
    const dt = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + i);
    if (!A.diasSemana.includes(dt.getDay())) continue;
    if (slotsDoDia(dt).length === 0) continue;
    dias.set(keyDia(dt), dt);
  }
  return dias;
}

async function renderAgendaInline(rota = {}) {
  let modo = 'local';
  let slotsCal = null, isoCal = null;
  const dStr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  {
    const hoje = new Date();
    const fimJanela = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + CONFIG.AGENDA.diasAdiante);
    const q = state.data.qualificacao || {};
    const r = await postJSON(CONFIG.API_AGENDA, {
      action: 'slots', start: dStr(hoje), end: dStr(fimJanela),
      renda: q.investimento || '', nicho: '', bio: '',
      vendorEventTypeId: state.data.vendorEventTypeId || rota.vendorEventTypeId || null,
    }, 8000);
    if (r && r.ok && r.slots && Object.keys(r.slots).length) {
      modo = 'cal'; slotsCal = r.slots; isoCal = r.iso || {};
      state.data.callTrack = r.track || '';
      state.data.vendedor = r.vendor || '';
      state.data.vendorEventTypeId = r.vendorEventTypeId || null;
    }
  }
  state.data.agendaModo = modo; persist();

  if (modo !== 'cal' && rota && rota.embedLink) { renderAgendaEmbed(rota); return; }

  let disponiveis;
  if (modo === 'cal') {
    disponiveis = new Map();
    Object.keys(slotsCal).sort().forEach((k) => {
      const [y, mo, d] = k.split('-').map(Number);
      disponiveis.set(k, new Date(y, mo - 1, d));
    });
  } else {
    disponiveis = diasDisponiveis();
  }
  const horariosDo = (dt) => modo === 'cal' ? (slotsCal[keyDia(dt)] || []) : slotsDoDia(dt);
  const isoDe = (dt, hora) => {
    if (modo === 'cal') return (isoCal[keyDia(dt)] || {})[hora] || '';
    const [hh, mm] = hora.split(':').map(Number);
    return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate(), hh, mm).toISOString();
  };

  const agora = new Date();
  const semanaHoje = fmtSemana.format(agora);
  const horaAgora = `${String(agora.getHours()).padStart(2, '0')}:${String(agora.getMinutes()).padStart(2, '0')}`;

  const row = addRow('bot', `
    <div class="ag-head">
      <span class="ag-ic">📅</span>
      <div><h4>Agenda hoje</h4><p>Para sua conversa gratuita</p></div>
    </div>
    <div class="ag-body">
      <div class="ag-today"><span>📍 Hoje é ${esc(semanaHoje)}, ${horaAgora}</span></div>
      <div class="ag-nav">
        <button type="button" class="ag-prev" aria-label="Mês anterior">‹</button>
        <b class="ag-mes"></b>
        <button type="button" class="ag-next" aria-label="Próximo mês">›</button>
      </div>
      <div class="ag-grid">
        <div class="ag-week">${DIAS_SEMANA_ABREV.map(d => `<span>${d}</span>`).join('')}</div>
        <div class="ag-days"></div>
      </div>
      <div class="ag-slots-area"></div>
      <div class="ag-foot">Toque em um horário para agendar</div>
    </div>
  `, 'agenda-card');

  const card = row.querySelector('.agenda-card');
  const mesEl = card.querySelector('.ag-mes');
  const daysEl = card.querySelector('.ag-days');
  const slotsArea = card.querySelector('.ag-slots-area');
  const btnPrev = card.querySelector('.ag-prev');
  const btnNext = card.querySelector('.ag-next');

  const datas = [...disponiveis.values()];
  const primeiroMes = new Date(agora.getFullYear(), agora.getMonth(), 1);
  const ultimoMes = datas.length
    ? new Date(datas[datas.length - 1].getFullYear(), datas[datas.length - 1].getMonth(), 1)
    : primeiroMes;

  let mesAtual = primeiroMes;
  let diaSel = null;

  function renderMes() {
    mesEl.textContent = capitalizar(fmtMes.format(mesAtual));
    btnPrev.disabled = mesAtual <= primeiroMes;
    btnNext.disabled = mesAtual >= ultimoMes;
    daysEl.textContent = '';
    const primeiroDiaSemana = mesAtual.getDay();
    const totalDias = new Date(mesAtual.getFullYear(), mesAtual.getMonth() + 1, 0).getDate();
    for (let i = 0; i < primeiroDiaSemana; i++) {
      daysEl.appendChild(document.createElement('span'));
    }
    for (let d = 1; d <= totalDias; d++) {
      const dt = new Date(mesAtual.getFullYear(), mesAtual.getMonth(), d);
      const k = keyDia(dt);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ag-d';
      btn.textContent = d;
      if (disponiveis.has(k)) {
        btn.classList.add('on');
        if (diaSel && keyDia(diaSel) === k) btn.classList.add('sel');
        btn.onclick = () => { diaSel = dt; renderMes(); renderSlots(); };
      }
      daysEl.appendChild(btn);
    }
  }

  function renderSlots() {
    slotsArea.textContent = '';
    if (!diaSel) return;
    const titulo = document.createElement('div');
    titulo.className = 'ag-slots-title';
    titulo.textContent = `Horários para ${fmtDiaLongo.format(diaSel)}`;
    const grid = document.createElement('div');
    grid.className = 'ag-slots';
    horariosDo(diaSel).forEach((h) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'ag-slot';
      b.textContent = h;
      b.onclick = () => confirmarAgendamento(card, diaSel, h, isoDe(diaSel, h));
      grid.appendChild(b);
    });
    slotsArea.appendChild(titulo);
    slotsArea.appendChild(grid);
    scrollDown();
  }

  if (datas.length) { diaSel = datas[0]; mesAtual = new Date(diaSel.getFullYear(), diaSel.getMonth(), 1); }
  renderMes();
  renderSlots();
}

async function confirmarAgendamento(card, dia, hora, iso) {
  if (state.data.agendado) return;
  const d = state.data;

  card.style.pointerEvents = 'none';
  const foot = card.querySelector('.ag-foot');
  if (foot) foot.textContent = 'Confirmando seu horário…';

  let quandoISO = iso || new Date(dia.getFullYear(), dia.getMonth(), dia.getDate(), +hora.split(':')[0], +hora.split(':')[1]).toISOString();
  let bookingUid = '', videoUrl = '';

  if (d.agendaModo === 'cal') {
    const q = d.qualificacao || {};
    const r = await postJSON(CONFIG.API_AGENDA, {
      action: 'book', start: quandoISO,
      nome: d.nome, email: d.email, whatsapp: d.whatsapp,
      renda: q.investimento || '', nicho: '', bio: '',
      vendorEventTypeId: d.vendorEventTypeId || null,
      metadata: { lead_ref: state.leadRef, origem: 'scanner-envelhecimento' },
    }, 14000);
    if (r && r.ok) {
      bookingUid = r.uid || '';
      videoUrl = r.videoUrl || '';
      state.data.callTrack = r.track || state.data.callTrack || '';
      state.data.vendedor = r.vendor || state.data.vendedor || '';
      if (r.start) quandoISO = r.start;
    } else if (r && r.reason === 'slot_taken') {
      card.closest('.row')?.remove();
      await bot('Eita — esse horário acabou de ser preenchido por outra pessoa 😅 Escolhe outro aqui:', { delay: 800 });
      await renderAgendaInline();
      return;
    } else {
      card.closest('.row')?.remove();
      await bot('Ops, não consegui confirmar esse horário agora 😅 Pode escolher de novo aqui? Aí eu já registro certinho:', { delay: 800 });
      await renderAgendaInline();
      return;
    }
  }

  state.data.agendado = true;
  state.data.agendamentoEm = quandoISO;
  state.data.bookingUid = bookingUid;
  state.data.videoUrl = videoUrl;
  persist();
  salvarLead('agendado');
  dispararAgendamento();

  const quando = new Date(quandoISO);
  const diaTxt = `${capitalizar(fmtSemana.format(quando))}, ${fmtDiaLongo.format(quando)}`;
  const horaTxt = `${String(quando.getHours()).padStart(2, '0')}:${String(quando.getMinutes()).padStart(2, '0')}`;
  const vParam = videoUrl ? `&v=${encodeURIComponent(videoUrl)}` : '';
  const pageUrl = bookingUid
    ? `call.html?id=${encodeURIComponent(bookingUid)}${vParam}`
    : `call.html?t=${encodeURIComponent(quandoISO)}&n=${encodeURIComponent(d.nome || '')}${vParam}`;

  card.style.pointerEvents = '';
  card.innerHTML = `
    <div class="ag-head">
      <span class="ag-ic">📅</span>
      <div><h4>Conversa agendada</h4><p>Te espero lá!</p></div>
    </div>
    <div class="ag-done">
      <div class="ag-check">✓</div>
      <h4>${esc(diaTxt)} às ${esc(horaTxt)}</h4>
      <p>Confirmação chega no seu WhatsApp e e-mail.</p>
      <a class="ag-link" href="${pageUrl}" target="_blank" rel="noopener">📄&nbsp; Minha página da reunião</a>
    </div>
  `;
  scrollDown();

  const s = safeData();
  await bot(`✅ <b>Agendado, ${s.primeiro}!</b> ${esc(diaTxt)} às <b>${esc(horaTxt)}</b>. Salvei sua <a href="${pageUrl}" target="_blank" rel="noopener"><b>página da reunião</b></a> — lá tem o contador e o botão de entrar. Até lá! 🚀`, { delay: 900 });
}

/* ================================================================
   REPLAY (refresh no meio do fluxo) + BOOT
   Simplificado: no retorno, mostra só as respostas já dadas (sem
   repetir cada pergunta) e retoma a etapa atual normalmente.
   ================================================================ */
function replayUserLabel(st) {
  const d = state.data;
  if (st === 0) return d.nome;
  if (st === 1) return (d.paisDDI && d.paisDDI !== '55')
    ? '+' + d.paisDDI + ' ' + (d.whatsapp || '').slice(d.paisDDI.length)
    : maskFone((d.whatsapp || '').slice(2));
  if (st === 2) return d.email;
  if (st >= 3 && st < 3 + PERGUNTAS.length) {
    const q = PERGUNTAS[st - 3];
    const r = d.respostas[q.id];
    if (!r) return '';
    const opt = q.opcoes.find(o => o.letra === r.letra);
    return opt ? opt.texto : '';
  }
  const qi = st - (3 + PERGUNTAS.length);
  if (qi >= 0 && qi < QUALIFICACAO.length) {
    const q = QUALIFICACAO[qi];
    return (d.qualificacao || {})[q.id] || '';
  }
  return '';
}

function resumeFrom(step) {
  if (step === 1) return etapaWhats(true);
  if (step === 2) return etapaEmail(true);
  if (step === 3) return etapaIntroQuiz();
  if (step >= 4 && step <= 3 + PERGUNTAS.length) return etapaPergunta(step - 4, true);
  const qi = step - (3 + PERGUNTAS.length);
  if (qi >= 0 && qi < QUALIFICACAO.length) return etapaQualificacao(qi, true);
  return etapaNome();
}

async function boot() {
  sendBtn.onclick = () => onSubmit && onSubmit();
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); onSubmit && onSubmit(); } });

  if (state.done) {
    await bot('Bem-vindo de volta! Aqui está seu resultado outra vez:', { delay: 600 });
    await etapaFinal();
  } else if (state.step > 0 && state.step < TOTAL_STEPS && state.data.nome) {
    for (let st = 0; st < state.step; st++) {
      const label = replayUserLabel(st);
      if (label) user(label);
    }
    setProgress(state.step);
    await bot('Continuando de onde você parou 😉', { delay: 600 });
    await resumeFrom(state.step);
  } else {
    await sleep(500);
    await etapaNome();
  }
}
boot();
</script>
